<!DOCTYPE html>
<html>
<head>

<title>{{ service }} Workers</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#eef2f7;
font-family:'Poppins',sans-serif;
}

.container{
margin-top:40px;
}

.worker-card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
margin-bottom:20px;
transition:0.3s;
}

.worker-card:hover{
transform:translateY(-5px);
}

.badge-rating{
background:gold;
color:black;
padding:5px 10px;
border-radius:10px;
font-size:12px;
}

.badge-work{
background:#1d74f5;
color:white;
padding:5px 10px;
border-radius:10px;
font-size:12px;
}

</style>

</head>

<body>

<div class="container">

<h2 class="mb-4 text-center">
{{ service|capitalize }} Workers
</h2>

{% if workers %}

{% for w in workers %}

<div class="worker-card">

<h4>{{ w.name }}</h4>

<p><b>Service:</b> {{ w.service }}</p>

<p>
<span class="badge-rating">⭐ {{ w.rating }}</span>
<span class="badge-work">🔧 {{ w.works_done }} works</span>
</p>

<a href="/worker_profile/{{ w.id }}" class="btn btn-outline-primary">
View Profile
</a>

<a href="/hire/{{ w.id }}" class="btn btn-success">
Request to Hire
</a>

</div>

{% endfor %}

{% else %}

<p>No workers available.</p>

{% endif %}

</div>

</body>
</html>
