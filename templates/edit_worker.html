{% extends "base_worker.html" %}

{% block content %}

<style>

body{
    background:#f4f6f9;
    font-family:'Poppins',sans-serif;
}

/* Card */
.edit-box{
    max-width:520px;
    margin:60px auto;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.15);
    animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* Inputs */
.form-control{
    border-radius:25px;
    padding:12px;
    margin-bottom:15px;
}

.form-label{
    font-weight:600;
    margin-bottom:5px;
}

/* Button */
.btn-update{
    width:100%;
    border-radius:25px;
    padding:12px;
    font-weight:600;
    transition:0.3s;
}

.btn-update:hover{
    transform:scale(1.05);
}

/* Map */
#map{
    height:250px;
    border-radius:15px;
    margin-bottom:15px;
}

/* Helper text */
.small-text{
    font-size:12px;
    color:#777;
}

</style>

<div class="edit-box">

<h3 class="text-center mb-4">Edit Profile</h3>

<form method="POST">

<!-- FIRST NAME -->
<label class="form-label">First Name</label>
<input type="text" name="first_name"
class="form-control"
value="{{ worker.first_name }}"
placeholder="Enter first name" required>

<!-- LAST NAME -->
<label class="form-label">Last Name</label>
<input type="text" name="last_name"
class="form-control"
value="{{ worker.last_name }}"
placeholder="Enter last name" required>

<!-- SERVICE (🔥 TYPE + SUGGESTIONS) -->
<label class="form-label">Service Type</label>
<input type="text" name="service_type"
class="form-control"
value="{{ worker.service_type }}"
list="services"
placeholder="e.g. Electrician, Plumber, AC Repair"
required>

<datalist id="services">
    <option value="Plumber">
    <option value="Electrician">
    <option value="Carpenter">
    <option value="Cleaning">
    <option value="Painter">
    <option value="AC Repair">
    <option value="Mechanic">
    <option value="Gardener">
    <option value="Appliance Repair">
</datalist>

<p class="small-text">You can type your own service or select from suggestions</p>

<!-- DESCRIPTION -->
<label class="form-label">Description</label>
<textarea name="description"
class="form-control"
rows="3"
maxlength="100"
placeholder="Describe your skills (max 100 words)">{{ worker.description }}</textarea>

<p class="small-text">Example: Experienced electrician with 5+ years work</p>

<!-- LOCATION -->
<label class="form-label">Select Your Location</label>
<div id="map"></div>

<input type="hidden" name="latitude" id="latitude" value="{{ worker.latitude }}">
<input type="hidden" name="longitude" id="longitude" value="{{ worker.longitude }}">

<button class="btn btn-primary btn-update mt-3">
Update Profile
</button>

</form>

</div>

<!-- LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// Safe values (avoid JS error)
var lat = {{ (worker.latitude if worker.latitude else 9.9312) | tojson }};
var lng = {{ (worker.longitude if worker.longitude else 76.2673) | tojson }};

var map = L.map('map').setView([lat, lng], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

var marker = L.marker([lat, lng]).addTo(map);

// Click to update
map.on('click', function(e){

    var newLat = e.latlng.lat;
    var newLng = e.latlng.lng;

    document.getElementById("latitude").value = newLat;
    document.getElementById("longitude").value = newLng;

    marker.setLatLng([newLat, newLng]);
});

</script>

{% endblock %}
