<!DOCTYPE html>
<html>
<head>
<title>HandyHub | Worker Registration</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
    font-family:'Poppins',sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0d6efd,#00c6ff);
}

/* Card */
.register-box{
    background:rgba(255,255,255,0.95);
    padding:35px;
    border-radius:20px;
    width:420px;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
    animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
    from{ transform:translateY(40px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
}

h2{
    text-align:center;
    margin-bottom:20px;
    font-weight:600;
}

/* Inputs */
.form-control{
    border-radius:30px;
    padding:12px;
    margin-bottom:15px;
    transition:0.3s;
}

.form-control:focus{
    box-shadow:0 0 10px #0d6efd;
    transform:scale(1.03);
}

/* Button */
.btn-register{
    width:100%;
    border-radius:30px;
    padding:12px;
    font-weight:600;
    transition:0.3s;
}

.btn-register:hover{
    transform:scale(1.05);
}

/* Map */
#map{
    height:250px;
    border-radius:15px;
    margin-bottom:10px;
}

/* Small text */
.map-note{
    font-size:12px;
    color:#666;
    margin-bottom:10px;
}

</style>

</head>

<body>

<div class="register-box">

<h2>👷 Worker Registration</h2>

<!-- 🔥 FLASH MESSAGES -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

<form method="POST">

<input type="text" name="first_name" class="form-control" placeholder="First Name" required>

<input type="text" name="last_name" class="form-control" placeholder="Last Name" required>

<input type="email" name="email" class="form-control" placeholder="Email Address" required>

<input type="password" name="password" class="form-control" placeholder="Password" required>

<input type="text" name="service_type" class="form-control"
placeholder="Service Type (Plumber / Electrician / Carpenter)" required>

<!-- 📍 MAP -->
<label class="fw-semibold">📍 Select Your Location</label>
<div id="map"></div>

<div class="map-note">
Click on the map or allow location access to set your position
</div>

<input type="hidden" name="latitude" id="latitude">
<input type="hidden" name="longitude" id="longitude">

<button type="submit" class="btn btn-primary btn-register">
Register
</button>

</form>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- MAP SCRIPT -->
<script>

// Default (Kochi)
var map = L.map('map').setView([9.9312, 76.2673], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

var marker;

// Click to select location
map.on('click', function(e){

    var lat = e.latlng.lat;
    var lng = e.latlng.lng;

    document.getElementById("latitude").value = lat;
    document.getElementById("longitude").value = lng;

    if(marker){
        map.removeLayer(marker);
    }

    marker = L.marker([lat, lng]).addTo(map);
});

// Auto-detect location
if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(position){

        var lat = position.coords.latitude;
        var lng = position.coords.longitude;

        map.setView([lat, lng], 15);

        marker = L.marker([lat, lng]).addTo(map);

        document.getElementById("latitude").value = lat;
        document.getElementById("longitude").value = lng;

    });
}

</script>

</body>
</html>
