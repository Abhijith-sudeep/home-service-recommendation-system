<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile | HandyHub</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
    font-family:'Poppins',sans-serif;
    background:#f4f6f9;
}

/* Sidebar */
.sidebar{
    height:100vh;
    width:220px;
    position:fixed;
    top:0;
    left:0;
    background:linear-gradient(180deg,#0d6efd,#00c6ff);
    padding-top:30px;
    color:white;
}

.sidebar h4{
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:white;
    padding:12px 20px;
    text-decoration:none;
    transition:0.3s;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.2);
}

/* Main Content */
.main{
    margin-left:240px;
    padding:40px;
}

/* Card */
.card-box{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* Map */
#map{
    height:300px;
    border-radius:12px;
    margin-bottom:15px;
}

/* Button */
.btn-save{
    border-radius:25px;
    padding:10px;
    font-weight:600;
    transition:0.3s;
}

.btn-save:hover{
    transform:scale(1.05);
}

</style>

</head>

<body>

<!-- 🔥 SIDEBAR -->
<div class="sidebar">
    <h4>HandyHub</h4>

    <a href="/user_dashboard"><i class="fa fa-home"></i> Dashboard</a>
    <a href="/search"><i class="fa fa-search"></i> Search Workers</a>
    <a href="/edit_user"><i class="fa fa-user"></i> Edit Profile</a>
    <a href="/logout"><i class="fa fa-sign-out-alt"></i> Logout</a>
</div>

<!-- MAIN CONTENT -->
<div class="main">

<div class="card-box">

<h3 class="mb-4">Edit Profile</h3>

<form method="POST">

<div class="mb-3">
    <label class="form-label">Full Name</label>
    <input type="text" name="name" class="form-control"
           value="{{ user.name }}" required>
</div>

<div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control"
           value="{{ user.email }}" required>
</div>

<!-- 📍 MAP -->
<label class="form-label">Select Location</label>
<div id="map"></div>

<input type="hidden" name="latitude" id="latitude" value="{{ user.latitude }}">
<input type="hidden" name="longitude" id="longitude" value="{{ user.longitude }}">

<button type="submit" class="btn btn-primary btn-save w-100 mt-3">
    Update Profile
</button>

</form>

</div>

</div>

<!-- MAP SCRIPT -->
<script>

var lat = {{ (user.latitude if user.latitude else 9.9312) | tojson }};
var lng = {{ (user.longitude if user.longitude else 76.2673) | tojson }};

var map = L.map('map').setView([lat, lng], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

var marker = L.marker([lat, lng]).addTo(map);

map.on('click', function(e){

    var newLat = e.latlng.lat;
    var newLng = e.latlng.lng;

    document.getElementById("latitude").value = newLat;
    document.getElementById("longitude").value = newLng;

    marker.setLatLng([newLat, newLng]);
});

</script>

</body>
</html>
