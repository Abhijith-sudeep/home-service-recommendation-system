<!DOCTYPE html>
<html>
<head>
    <title>HandyHub | Worker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
    margin:0;
}

/* Sidebar */
.sidebar{
    width:220px;
    height:100vh;
    position:fixed;
    background:linear-gradient(#1d74f5,#19b6d2);
    color:white;
    padding:20px;
}

.sidebar h4{
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    margin:12px 0;
}

.sidebar a:hover{
    opacity:0.8;
}

/* Main content */
.main{
    margin-left:220px;
    padding:30px;
    background:#f4f6f9;
    min-height:100vh;
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h4>HandyHub</h4>

    <a href="/worker_dashboard">🏠 Dashboard</a>
    <a href="/worker_jobs">📋 Jobs</a>
    <a href="/edit_worker">✏️ Edit Profile</a>
    <a href="/logout">🚪 Logout</a>

</div>

<!-- CONTENT -->
<div class="main">
    {% block content %}{% endblock %}
</div>

</body>
</html>
