<!DOCTYPE html>
<html>
<head>
    <title>HandyHub | Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#0d6efd,#00c6ff);
}

/* Login Card */

.login-box{
    background:rgba(255,255,255,0.95);
    padding:40px;
    border-radius:20px;
    width:360px;

    box-shadow:0 15px 40px rgba(0,0,0,0.2);

    animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
    from{
        transform:translateY(40px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

h2{
    text-align:center;
    margin-bottom:25px;
    font-weight:600;
}

/* Inputs */

.form-control{
    border-radius:30px;
    padding:12px;
    margin-bottom:15px;
    transition:0.3s;
}

.form-control:focus{
    box-shadow:0 0 10px #0d6efd;
    transform:scale(1.03);
}

/* Button */

.btn-login{
    width:100%;
    border-radius:30px;
    padding:12px;
    font-weight:600;
    transition:0.3s;
}

.btn-login:hover{
    transform:scale(1.05);
}

/* Register link */

.register-link{
    text-align:center;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="login-box">

<h2> Login</h2>

<form method="POST">

<input type="email"
       name="email"
       class="form-control"
       placeholder="Email Address"
       required>

<input type="password"
       name="password"
       class="form-control"
       placeholder="Password"
       required>

<button type="submit" class="btn btn-primary btn-login">
Login
</button>

</form>

<div class="register-link">
<a href="/register_user">Don't have an account? Register here</a>
</div>

</div>

</body>
</html>
